spring:
  application:
    name: tradeup

  config:
    # Loads backend/.env as a property source. It is optional so a deployment can
    # supply the same names as real environment variables instead, and the
    # .properties hint tells Boot how to parse a file with no recognised suffix.
    import: optional:file:.env[.properties]

  # PostgreSQL (Neon). Credentials are never written here: they come from
  # backend/.env, which is gitignored, or from real environment variables in a
  # deployment. There is deliberately no fallback value — if the configuration is
  # missing the application refuses to start rather than quietly running against
  # some other database.
  datasource:
    url: ${TRADEUP_DB_URL}
    username: ${TRADEUP_DB_USER}
    password: ${TRADEUP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon's pooled endpoint is shared and serverless, so keep the pool small
      # and let idle connections go rather than holding them open.
      maximum-pool-size: 8
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 900000
      pool-name: tradeup-pool

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          lob:
            non_contextual_creation: true
        order_inserts: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      # Java 21 virtual threads: one per request, so a slow client cannot tie up a
      # platform thread that another student is waiting on.
      enabled: true

server:
  # Render (and most hosts) assign the port at runtime through PORT and require
  # the process to bind it. The 8080 default keeps local development unchanged.
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ng.edu.unilag.tradeup: INFO
    org.hibernate.SQL: WARN

tradeup:
  security:
    # Must be at least 32 characters. Set it in backend/.env.
    jwt-secret: ${TRADEUP_JWT_SECRET}
    # Comma-separated emails granted moderator rights at startup. There is no
    # shared moderator account: each person registers normally and is promoted
    # by being named here.
    admin-emails: ${TRADEUP_ADMIN_EMAILS:}
    token-validity: P7D
    issuer: tradeup

  cors:
    allowed-origins: ${TRADEUP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

  storage:
    upload-dir: ./data/uploads
    archive-dir: ./data/archives
    public-prefix: /uploads

  seed:
    # Fills an empty database with the team, a catalogue and some completed
    # trades. It only runs when the users table is empty, so it is safe to leave
    # on — but turn it off for anything resembling production.
    enabled: ${TRADEUP_SEED_ENABLED:true}
    # Password given to the seeded accounts. Leave unset and a random one is
    # generated and logged at startup, so this repository never contains a
    # password that works against a real deployment.
    password: ${TRADEUP_SEED_PASSWORD:}

---
# Offline fallback: an embedded file database, no network and no credentials.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/tradeup;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
