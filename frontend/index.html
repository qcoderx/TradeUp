<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>TradeUp — A student marketplace for smarter living</title>
    <meta
      name="description"
      content="Buy, sell and swap textbooks, lab kit and hostel essentials with other students at the University of Lagos. Built by Group 15 for SDG 12."
    />
    <meta name="theme-color" content="#16204A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1024" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TradeUp — A student marketplace for smarter living" />
    <meta
      property="og:description"
      content="Every item that changes hands here is one that did not have to be made again. University of Lagos, COS202 Group 15."
    />
    <meta property="og:image" content="/brand/og-card.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so a returning visitor never sees a flash of
      // the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("tradeup-theme");
          var dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* Private browsing can throw on localStorage; the light theme is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
